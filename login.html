<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 - 맛길</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <!-- JSDelivr 를 통해 Pretendard 폰트 추가 (JSDelivr는 오픈소스를 위해 운영되는 CDN(Content Delivery Network) 서비스) -->
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="header-left">
          <a href="index.html" class="logo">
            <img
              src="assets/img/Logo.svg"
              alt=""
              class="logo-icon"
              width="28"
              height="28"
            />
            맛길
          </a>
          <!-- 로고: 클릭 시 메인 페이지로 이동 -->
          <nav class="nav">
            <a href="index.html">홈</a>
            <a href="event.html">이벤트</a>
            <a href="about.html">소개</a>
          </nav>
        </div>

        <div class="header-right">
          <div class="search-bar">
            <input
              class="search-input"
              type="text"
              placeholder="검색어를 입력해주세요"
            />
            <button class="search-button" type="button">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
            </button>
          </div>
          <a href="login.html" class="btn-login">로그인</a>
        </div>
      </div>
    </header>

    <h1 id="title">로그인</h1> <!-- h1 태그: 페이지 최상위 제목 -->
    <form id="login-form" novalidate>
    <div id="form">
      <!-- 아이디 입력 행 -->
      <div class="input-row">
        <label class="input-label" for="input-id">아이디</label>
        <!-- for 속성으로 label과 input 연결 (label 클릭 시 input 포커스) -->
        <input
          class="input-field"
          id="input-id"
          type="text"
          placeholder="아이디를 입력해주세요"
          autocomplete="username"
        />
        <p class="field-error" id="input-id-error" aria-live="polite"></p>
      </div>

      <!-- 비밀번호 입력 행 -->
      <div class="input-row">
        <label class="input-label" for="input-password">비밀번호</label>
        <!-- password 타입: 입력값 마스킹 처리 -->
        <input
          class="input-field"
          id="input-password"
          type="password"
          placeholder="비밀번호를 입력해주세요"
          autocomplete="current-password"
        />
        <p class="field-error" id="input-password-error" aria-live="polite"></p>
      </div>

      <!-- 자동 로그인 체크박스 -->
      <div id="auto-login-row">
        <label id="auto-login-label">
          <input
            class="checkbox-input"
            id="auto-login-checkbox"
            type="checkbox"
          />
          <span id="auto-login-text">자동 로그인</span>
        </label>
      </div>

      <!-- 로봇이 아닙니다 (reCAPTCHA 시뮬레이션) -->
      <div id="captcha-box">
        <div id="captcha-left">
          <div id="captcha-checkbox" onclick="handleCaptcha()">
            <div id="captcha-spinner"></div>
            <svg id="captcha-check" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M5 13l4 4L19 7" stroke="#e85d4a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span id="captcha-label">로봇이 아닙니다</span>
        </div>
        <div id="captcha-right">
          <span id="captcha-privacy">개인정보처리방침</span>
          <span id="captcha-terms">이용약관</span>
        </div>
      </div>
      <p class="field-error" id="captcha-error" aria-live="polite"></p>

      <!-- 로그인 버튼 -->
      <div id="button-container">
        <button type="submit" id="login-button">로그인</button> <!-- submit 타입: 폼 제출 버튼 -->
      </div>

      <!-- 하단 링크 영역 -->
      <div id="link-container">
        <a class="link" href="#">아이디 찾기</a>
        <span class="link-divider">|</span>
        <a class="link" href="#">비밀번호 찾기</a>
        <span class="link-divider">|</span>
        <a class="link" href="sigunup.html">회원가입</a>
      </div>
    </div>
    </form>

  <script src="js/login.js"></script>
  </body>
</html>
